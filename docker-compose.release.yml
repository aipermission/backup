services:
  backup:
    image: ghcr.io/aipermission/backup:${AIPERMISSION_BACKUP_VERSION:-0.2.0}
    restart: unless-stopped
    environment:
      AIPERMISSION_BACKUP_LISTEN_ADDR: 0.0.0.0:8080
      AIPERMISSION_BACKUP_TOKEN_FILE: /run/secrets/backup_token
      AIPERMISSION_BACKUP_MAX_STORAGE_BYTES: ${AIPERMISSION_BACKUP_MAX_STORAGE_BYTES:-}
    secrets:
      - backup_token
    group_add:
      - "${AIPERMISSION_BACKUP_SECRET_GID:-1000}"
    volumes:
      - backup_data:/data
    ports:
      - "127.0.0.1:${AIPERMISSION_BACKUP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

secrets:
  backup_token:
    file: ./secrets/backup-token

volumes:
  backup_data:
